# Render Blueprint for Vaultspring Wallet (full-stack: Express API + built frontend)
# Connect this GitHub repo on Render (New + -> Blueprint) and it will read this file.
services:
  - type: web
    name: vaultspring-wallet
    runtime: node
    plan: free
    region: oregon
    # Build the Vite frontend (dist/) and install ALL deps (tsx is a devDependency
    # but is required at runtime to start server.ts), then start the full-stack server.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npx tsx server.ts
    healthCheckPath: /api/config
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: ALLOWED_ORIGIN
        # The Vercel frontend origin allowed to call this API directly.
        value: https://vaultspring-wallet.vercel.app
